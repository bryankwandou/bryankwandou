<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0c0e" />
      <stop offset="50%" stop-color="#121215" />
      <stop offset="100%" stop-color="#0c0c0e" />
    </linearGradient>
    <radialGradient id="emberGlow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#E4703A" stop-opacity="0.22" />
      <stop offset="70%" stop-color="#E4703A" stop-opacity="0.0" />
    </radialGradient>
    <radialGradient id="solanaGlow" cx="15%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#14F195" stop-opacity="0.14" />
      <stop offset="80%" stop-color="#14F195" stop-opacity="0.0" />
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect width="900" height="220" rx="14" fill="url(#bgGrad)" stroke="#262629" stroke-width="1.5" />
  
  <!-- Ambient Glows -->
  <rect width="900" height="220" rx="14" fill="url(#emberGlow)" />
  <rect width="900" height="220" rx="14" fill="url(#solanaGlow)" />
  <rect width="900" height="220" rx="14" fill="url(#grid)" />

  <!-- Top Accent Bar -->
  <line x1="28" y1="28" x2="872" y2="28" stroke="#262629" stroke-width="1" />
  <circle cx="38" cy="28" r="3.5" fill="#E4703A" />
  <circle cx="52" cy="28" r="3.5" fill="#262629" />
  <circle cx="66" cy="28" r="3.5" fill="#262629" />
  
  <text x="80" y="32" fill="#787880" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="600" letter-spacing="1.5">CORE SYSTEMS RUNTIME // MAKASSAR, ID</text>
  
  <!-- Status Indicator (top right) -->
  <g transform="translate(730, 20)">
    <rect width="142" height="18" rx="9" fill="#14F195" fill-opacity="0.12" stroke="#14F195" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="12" cy="9" r="3.5" fill="#14F195" />
    <text x="24" y="13" fill="#14F195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10" font-weight="700" letter-spacing="0.5">24/24 SYSTEMS LIVE</text>
  </g>

  <!-- Main Headline -->
  <text x="40" y="94" fill="#f3f3f1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.8">BRYAN KWANDOU</text>

  <!-- Role Subtitle -->
  <text x="40" y="128" fill="#E4703A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="14" font-weight="600" letter-spacing="1.2">AUTONOMOUS SYSTEMS ARCHITECT · AGENTIC SECURITY &amp; ON-CHAIN POLICY</text>

  <!-- Tagline -->
  <text x="40" y="156" fill="#a0a0a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400">
    Enforcing deterministic authority boundaries and execution firewalls in front of autonomous machines.
  </text>

  <!-- Bottom Badges Strip -->
  <g transform="translate(40, 178)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="138" height="24" rx="5" fill="#18181c" stroke="#262629" stroke-width="1" />
    <text x="10" y="16" fill="#f3f3f1" font-family="monospace" font-size="11" font-weight="600">Solana Devnet</text>
    <circle cx="124" cy="12" r="3" fill="#14F195" />

    <!-- Pill 2 -->
    <rect x="148" y="0" width="148" height="24" rx="5" fill="#18181c" stroke="#262629" stroke-width="1" />
    <text x="158" y="16" fill="#f3f3f1" font-family="monospace" font-size="11" font-weight="600">Anchor Programs</text>

    <!-- Pill 3 -->
    <rect x="306" y="0" width="158" height="24" rx="5" fill="#18181c" stroke="#262629" stroke-width="1" />
    <text x="316" y="16" fill="#f3f3f1" font-family="monospace" font-size="11" font-weight="600">RFC 7231 HTTP 402</text>

    <!-- Pill 4 -->
    <rect x="474" y="0" width="128" height="24" rx="5" fill="#18181c" stroke="#262629" stroke-width="1" />
    <text x="484" y="16" fill="#f3f3f1" font-family="monospace" font-size="11" font-weight="600">Rust Core</text>

    <!-- Pill 5 -->
    <rect x="612" y="0" width="144" height="24" rx="5" fill="#18181c" stroke="#262629" stroke-width="1" />
    <text x="622" y="16" fill="#f3f3f1" font-family="monospace" font-size="11" font-weight="600">Next.js 16 + React 19</text>
  </g>
</svg>
