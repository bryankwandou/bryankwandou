<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Files</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #111827;
      --border: #374151;
      --text: #f9fafb;
      --text-muted: #9ca3af;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px 16px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      align-items: start;
    }
    @media (max-width: 800px) {
      .container {
        grid-template-columns: 1fr;
      }
    }
    .media-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    video {
      width: 100%;
      height: auto;
      max-height: 85vh;
      background: #000;
      display: block;
    }
    img {
      width: 100%;
      height: auto;
      max-height: 85vh;
      object-fit: contain;
      background: #000;
      display: block;
    }
    .actions {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--text-muted);
    }
    a {
      color: #60a5fa;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="media-card">
      <video controls playsinline preload="metadata">
        <source src="./submission/mozaikpay-nayrbryangaming.mp4" type="video/mp4">
      </video>
      <div class="actions">
        <span>mozaikpay-nayrbryangaming.mp4</span>
        <a href="./submission/mozaikpay-nayrbryangaming.mp4" download>Download</a>
      </div>
    </div>
    <div class="media-card">
      <a href="./submission/bukti-akun-tiktok-analytics.jpg" target="_blank">
        <img src="./submission/bukti-akun-tiktok-analytics.jpg" alt="bukti-akun-tiktok-analytics.jpg">
      </a>
      <div class="actions">
        <span>bukti-akun-tiktok-analytics.jpg</span>
        <a href="./submission/bukti-akun-tiktok-analytics.jpg" target="_blank">View Original</a>
      </div>
    </div>
  </div>
</body>
</html>
